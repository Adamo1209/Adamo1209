name: Generate/Update Self Introduction README cards

on:
  schedule:
    - cron: "0 0 ? * 1" # 每周一 0:00（UTC）定时触发【Cron表达式】
  workflow_dispatch:

jobs:
  build-card:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: git clone this repo
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=shadow_blue&card_width=500px&include_all_commits=true
          path: assets_auto/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&layout=compact&theme=shadow_blue&stats_format=bytes&card_width=500px
          path: assets_auto/top_langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=${{ github.repository_owner }}&show_icons=true&theme=shadow_blue&card_width=500px&layout=compact
          path: assets_auto/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@noreply.github.com"
          git add assets_auto/*.svg
          git commit -m "Update README cards" || exit 0
          git push
